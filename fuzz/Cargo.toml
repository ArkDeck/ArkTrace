# Separate workspace. libfuzzer-sys is a fuzz-only dependency and is not a
# member of the ArkTrace runtime workspace.
[package]
name = "arktrace-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99.0"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.8"
arktrace-ffi = { path = "../rust/crates/arktrace-ffi", features = ["fuzzing"] }

[[bin]]
name = "ffi-request"
path = "fuzz_targets/ffi_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi-config"
path = "fuzz_targets/ffi_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "htrace-systrace"
path = "fuzz_targets/htrace_systrace.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
