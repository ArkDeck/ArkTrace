[workspace]

[package]
name = "counter-detail-presentation-public-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
arktrace-contract = { path = "../../../rust/crates/arktrace-contract" }
arktrace-viewer = { path = "../../../rust/crates/arktrace-viewer" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
