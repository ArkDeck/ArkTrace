name: CI

# What this gate is and is not.
#
# The pinned TraceStreamer binary is a locally built artifact excluded by
# .gitignore. The fast hosted jobs deliberately do not spend CI time rebuilding
# it, so their parser integration tests XCTSkip themselves. The nightly/manual
# slow lane is the exception: it restores or downloads the exact approved
# release asset, verifies it against the committed manifest, and runs the real
# benchmark.
# The fast workflow is therefore still a necessary check, not a sufficient one
# -- hack/test_phase<N>.sh remain the release authority.
#
# Structure:
#   plan       - cheap Linux job; maps the diff to lanes via hack/ci_plan.sh
#                (fail closed: unknown paths, planner/workflow changes, or an
#                unresolvable base select every lane) and runs the planner's
#                own unit tests so the gate cannot rot silently.
#   swiftpm    - build (warnings are failures) + full test suite + skip audit.
#   app        - unsigned Xcode app build + bundle document-type checks; only
#                where the pinned parser bytes exist, and any parser found on
#                the runner is re-verified against the manifest SHA first.
#   contracts  - offline release gates (licenses, TraceStreamer lock, palette
#                measurements, phase6 evidence, CLI distribution contract,
#                planner tests).
#   ci-required- the single stable check for branch protection. It fails when
#                any planned lane failed or was skipped, so skipped jobs can
#                never drift past protection.
#   benchmark-slow - nightly/manual only; restores or downloads the approved
#                parser asset, fetches the locked medium fixture, and fails
#                closed on any identity drift. Never a merge gate.
#   scheduled-failure-alert - scheduled runs only. Opens or updates one
#                tracking issue when a lane fails, and closes it after a
#                later scheduled run is green. Never a merge gate.
#
# Toolchain policy: compile runners are pinned to xcode-27 with Xcode 27.0. If the
# pinned toolchain is missing the job fails immediately instead of silently
# building with whatever is newest.

on:
  pull_request:
  # Agent PRs are opened with GITHUB_TOKEN. Their pull_request-triggered runs
  # may wait for approval, so run the same required gate on the exact pushed
  # head as well.
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:
  schedule:
    # Nightly slow lane only; the fast lanes also run, keeping main's cache
    # warm for the first morning PR.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  TRACE_STREAMER_RELEASE_TAG: trace-streamer-4.3.7-0665e04e4abf

jobs:
  plan:
    name: Plan lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane_swiftpm: ${{ steps.plan.outputs.lane_swiftpm }}
      lane_app: ${{ steps.plan.outputs.lane_app }}
      lane_contracts: ${{ steps.plan.outputs.lane_contracts }}
      lane_rust_macos: ${{ steps.plan.outputs.lane_rust_macos }}
      lane_rust_windows: ${{ steps.plan.outputs.lane_rust_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: Planner self-test
        run: sh hack/test_ci_plan.sh

      - name: Compute changed paths and lanes
        id: plan
        run: |
          set -u
          changed_list="$RUNNER_TEMP/changed.txt"
          : > "$changed_list"
          resolved=false
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              if git merge-base --is-ancestor "$base" HEAD 2>/dev/null \
                 || git rev-parse --verify --quiet "$base" >/dev/null; then
                if merge_base=$(git merge-base "$base" HEAD 2>/dev/null); then
                  git diff --name-only "$merge_base" HEAD > "$changed_list" \
                    && resolved=true
                fi
              fi
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] \
                 && [ "$before" != "0000000000000000000000000000000000000000" ] \
                 && git rev-parse --verify --quiet "$before" >/dev/null; then
                git diff --name-only "$before" HEAD > "$changed_list" \
                  && resolved=true
              fi
              ;;
            *)
              # workflow_dispatch / schedule: no diff to reason about.
              resolved=false
              ;;
          esac
          if [ "$resolved" = true ]; then
            plan=$(sh hack/ci_plan.sh < "$changed_list")
          else
            # Fail closed: an empty input makes the planner select every lane.
            echo 'base/merge-base unavailable: selecting every lane' >&2
            plan=$(sh hack/ci_plan.sh < /dev/null)
          fi
          printf '%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"
          {
            echo '### Lane plan'
            echo '```'
            printf '%s\n' "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  swiftpm:
    name: SwiftPM build, test and skip audit
    needs: plan
    if: needs.plan.outputs.lane_swiftpm == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pin Xcode 27.0 (fail closed)
        run: |
          if [ ! -d "$PINNED_DEVELOPER_DIR" ]; then
            echo "::error::pinned toolchain $PINNED_DEVELOPER_DIR is absent on this runner; refusing to substitute another Xcode"
            ls -d /Applications/Xcode* 2>/dev/null || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$PINNED_DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Record toolchain
        id: toolchain
        run: |
          {
            echo '### Toolchain'
            echo '```'
            DEVELOPER_DIR="$PINNED_DEVELOPER_DIR" swift --version 2>&1
            DEVELOPER_DIR="$PINNED_DEVELOPER_DIR" xcodebuild -version 2>&1
            sw_vers 2>&1
            echo "SDK: $(DEVELOPER_DIR=$PINNED_DEVELOPER_DIR xcrun --show-sdk-version)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "xcode=27.0" >> "$GITHUB_OUTPUT"

      # The cache owns a stable source mirror as well as build/dependency/module
      # state. Restoring only `.build` under an ephemeral checkout path causes
      # llbuild to see a different package identity on every runner/worktree.
      # Only protected main saves; pull requests can restore but never poison.
      #
      # The pinned TraceStreamer binary is deliberately NOT part of any cache
      # path: it is gitignored, absent on hosted runners, and a restored copy
      # would have to re-pass the manifest hash and provenance checks anyway.
      - name: Restore SwiftPM build cache
        id: spm-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/arktrace-swiftpm/workspace
            !${{ runner.temp }}/arktrace-swiftpm/workspace/third_party/TraceStreamer/macx/trace_streamer
            ${{ runner.temp }}/arktrace-swiftpm/build
            ${{ runner.temp }}/arktrace-swiftpm/dependencies
            ${{ runner.temp }}/arktrace-swiftpm/ModuleCache
            ${{ runner.temp }}/arktrace-swiftpm/source-state
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'hack/run-swiftpm.sh') }}-${{ github.sha }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'hack/run-swiftpm.sh') }}-
            spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-

      # The package builds warning-free today and that is worth holding. If a
      # newer SDK introduces an unavoidable warning, relax this step rather
      # than letting the invariant rot silently.
      - name: Build (warnings are failures)
        env:
          ARKTRACE_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arktrace-swiftpm
        run: |
          set -o pipefail
          sh hack/run-swiftpm.sh build 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo '::error::swift build emitted warnings'
            grep 'warning:' build.log
            exit 1
          fi

      # Seven tests load the pinned parser bytes directly and fail rather than
      # skip when it is absent: the five AppDistribution resolver tests copy
      # the real binary into a synthetic bundle, and two CLI tests run real
      # fixtures end to end. They are named individually so the rest of their
      # classes still runs -- AppDistributionTests also holds the Info.plist
      # and document-type checks, which are among the most valuable here.
      - name: Test
        env:
          ARKTRACE_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arktrace-swiftpm
        run: |
          set -o pipefail
          sh hack/run-swiftpm.sh test \
            --skip 'ArkTraceAppSupportTests\.AppDistributionTests/testBundled' \
            --skip 'ArkTraceCLITests\.ProductionCommandExecutorTests/testCLITimeoutDrainsCacheRollbackBeforeReturning' \
            --skip 'ArkTraceCLITests\.ProductionCommandExecutorTests/testRealFixtureRunsAllEightCommandsInHumanAndMachineModes' \
            2>&1 | tee test.log

      # Skips are expected here only because the pinned parser is absent. A
      # skip from any other target means a test started opting out for a
      # reason this environment does not explain, which must not pass quietly.
      # Compiles the out-of-package consumer that pins the promised public
      # API; a tightened access level that would break the app fails here.
      - name: API baseline (out-of-package consumer)
        run: sh hack/test_api_baseline.sh

      - name: Reject unexpected skips
        run: |
          skipped=$(grep -c "' skipped (" test.log || true)
          unexpected=$(grep "' skipped (" test.log \
            | grep -v 'ArkTraceIntegrationTests\.' \
            | grep -v 'ArkTraceParserTests\.' || true)
          {
            echo '### Tests'
            echo "Excluded by --skip (need the pinned parser bytes): 7"
            echo "XCTSkip at runtime (parser/fixture guards and opt-in gates): ${skipped:-0}"
            echo
            echo 'Both groups require the locally built TraceStreamer binary.'
            echo 'Run the phase scripts on a machine that has it before release.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$unexpected" ]; then
            echo '::error::a test outside the parser-dependent targets skipped'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Save SwiftPM build cache (protected main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/arktrace-swiftpm/workspace
            !${{ runner.temp }}/arktrace-swiftpm/workspace/third_party/TraceStreamer/macx/trace_streamer
            ${{ runner.temp }}/arktrace-swiftpm/build
            ${{ runner.temp }}/arktrace-swiftpm/dependencies
            ${{ runner.temp }}/arktrace-swiftpm/ModuleCache
            ${{ runner.temp }}/arktrace-swiftpm/source-state
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'hack/run-swiftpm.sh') }}-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftpm-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: App build and bundle checks
    needs: plan
    if: needs.plan.outputs.lane_app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pin Xcode 27.0 (fail closed)
        run: |
          if [ ! -d "$PINNED_DEVELOPER_DIR" ]; then
            echo "::error::pinned toolchain $PINNED_DEVELOPER_DIR is absent on this runner; refusing to substitute another Xcode"
            exit 1
          fi
          echo "DEVELOPER_DIR=$PINNED_DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Install exact Rust toolchain for the native App
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Set external native build caches
        run: |
          echo "ARKTRACE_CARGO_CACHE_ROOT=$RUNNER_TEMP/arktrace-app-cargo" >> "$GITHUB_ENV"
          echo "ARKTRACE_RUST_SDK_CACHE_ROOT=$RUNNER_TEMP/arktrace-app-sdk" >> "$GITHUB_ENV"
          echo "ARKTRACE_NATIVE_APP_INPUT_CACHE_ROOT=$RUNNER_TEMP/arktrace-app-inputs" >> "$GITHUB_ENV"

      # Never trust a parser binary that appears on the runner (self-hosted
      # leftovers, restored artifacts): re-verify its bytes against the pinned
      # manifest before letting the copy phase embed it in the bundle. The
      # resolver and distribution tests repeat this at runtime; this step just
      # refuses to build a bundle from drifted bytes at all.
      - name: Verify any present parser against the pinned manifest
        id: parser
        run: |
          parser=third_party/TraceStreamer/macx/trace_streamer
          manifest=third_party/TraceStreamer/macx/manifest.json
          if [ ! -f "$parser" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected=$(jq -er '.binarySHA256' "$manifest")
          actual=$(shasum -a 256 "$parser" | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo '::error::TraceStreamer bytes on this runner do not match the pinned manifest'
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Stable source/object/package/module paths let Xcode reuse the graph
      # across ephemeral checkouts. Package products under SYMROOT are cached,
      # while the assembled app (and therefore its parser) is excluded. The
      # ignored parser is also excluded from source-mirror archives.
      - name: Restore Xcode object cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/arktrace-xcode/workspace
            !${{ runner.temp }}/arktrace-xcode/workspace/third_party/TraceStreamer/macx/trace_streamer
            ${{ runner.temp }}/arktrace-xcode/Objects
            ${{ runner.temp }}/arktrace-xcode/SourcePackages
            ${{ runner.temp }}/arktrace-xcode/PackageCache
            ${{ runner.temp }}/arktrace-xcode/ModuleCache
            ${{ runner.temp }}/arktrace-xcode/PrecompiledHeaders
            ${{ runner.temp }}/arktrace-xcode/source-state
            ${{ runner.temp }}/sym/Debug
            !${{ runner.temp }}/sym/Debug/ArkTrace.app
          key: xcobj-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-${{ hashFiles('Package.swift', 'Sources/**', 'Apps/**', 'ArkTrace.xcodeproj/**', 'Config/**', 'hack/run-xcodebuild.sh') }}-${{ github.sha }}
          restore-keys: |
            xcobj-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-${{ hashFiles('Package.swift', 'Sources/**', 'Apps/**', 'ArkTrace.xcodeproj/**', 'Config/**', 'hack/run-xcodebuild.sh') }}-
            xcobj-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-

      # The app target lives in the Xcode project, outside the SwiftPM graph,
      # so `swift build` never compiles it. The runner builds the production
      # Rust SDK/helper and stages the locked parser into the bundle, so
      # it cannot build at all without that binary. These steps therefore run
      # only where it is present -- a self-hosted runner, or a hosted one that
      # restored it (and re-passed the manifest check above). On a stock
      # hosted runner they are skipped, and test_phase3_batch1.sh remains the
      # place this is enforced.
      #
      # AppDistributionTests still binds Info.plist to
      # ArkTraceAppDistribution.supportedTraceExtensions on every run, so the
      # source-level half of the document-type contract is always checked.
      - name: Build app target (unsigned)
        id: app_build
        if: steps.parser.outputs.present == 'true'
        env:
          ARKTRACE_XCODE_CACHE_ROOT: ${{ runner.temp }}/arktrace-xcode
          ARKTRACE_XCODE_OUTPUT_ROOT: ${{ runner.temp }}/sym
        run: |
          set -o pipefail
          sh hack/run-xcodebuild.sh 2>&1 | tee xcodebuild.log

      - name: Verify app document types
        if: steps.app_build.outcome == 'success'
        run: hack/verify_app_document_types.sh "$RUNNER_TEMP/sym/Debug/ArkTrace.app"

      - name: Native button focus and keyboard regressions
        env:
          ARKTRACE_XCODE_CACHE_ROOT: ${{ runner.temp }}/arktrace-xcode
        run: python3 hack/test_native_focus_button.py

      - name: Note skipped app checks
        if: steps.parser.outputs.present != 'true'
        run: |
          {
            echo '### App bundle checks'
            echo 'Skipped: the app target embeds the pinned TraceStreamer'
            echo 'binary, which is not tracked. `hack/test_phase3_batch1.sh`'
            echo 'enforces the built-bundle document types on a machine that'
            echo 'has it.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Xcode object cache (protected main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app_build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/arktrace-xcode/workspace
            !${{ runner.temp }}/arktrace-xcode/workspace/third_party/TraceStreamer/macx/trace_streamer
            ${{ runner.temp }}/arktrace-xcode/Objects
            ${{ runner.temp }}/arktrace-xcode/SourcePackages
            ${{ runner.temp }}/arktrace-xcode/PackageCache
            ${{ runner.temp }}/arktrace-xcode/ModuleCache
            ${{ runner.temp }}/arktrace-xcode/PrecompiledHeaders
            ${{ runner.temp }}/arktrace-xcode/source-state
            ${{ runner.temp }}/sym/Debug
            !${{ runner.temp }}/sym/Debug/ArkTrace.app
          key: xcobj-v2-${{ runner.os }}-${{ runner.arch }}-xcode27.0-${{ hashFiles('Package.swift', 'Sources/**', 'Apps/**', 'ArkTrace.xcodeproj/**', 'Config/**', 'hack/run-xcodebuild.sh') }}-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-logs
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: Offline release gates
    needs: plan
    if: needs.plan.outputs.lane_contracts == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # These need no parser binary and no external inputs.
      - name: Offline release gates
        run: |
          hack/verify_licenses.sh
          hack/verify_trace_streamer_lock.sh
          hack/verify_palette.py --report
          python3 hack/test_palette_verifier.py
          hack/test_phase6.sh
          sh hack/test_ci_plan.sh
          python3 hack/test_run_swiftpm.py
          python3 hack/test_run_xcodebuild.py
          python3 hack/test_native_app_resources.py
          python3 hack/test_run_cargo.py
          python3 hack/test_cargo_cache.py
          python3 hack/test_windows_cli_distribution_contract.py
          python3 hack/test_stage_macos_rust_sdk.py
          python3 hack/verify_migration_contracts.py
          python3 hack/test_migration_contracts.py
          sh hack/test_scheduled_ci_alert.sh
          python3 -m unittest discover -s hack/rollback_conformance -p 'test_*.py'

  rust-macos:
    name: Rust macOS native
    needs: plan
    if: needs.plan.outputs.lane_rust_macos == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      ARKTRACE_EXPECT_NATIVE_HOST: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Select pinned Xcode
        run: |
          if [ ! -d "$PINNED_DEVELOPER_DIR" ]; then
            echo "::error::pinned Xcode 27 is absent; refusing another SDK"
            exit 1
          fi
          echo "DEVELOPER_DIR=$PINNED_DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Set external Cargo cache
        run: echo "ARKTRACE_CARGO_CACHE_ROOT=$RUNNER_TEMP/arktrace-cargo" >> "$GITHUB_ENV"
      - name: Format, architecture, licenses and contract checks
        run: |
          python3 hack/run-cargo.py fmt --all -- --check
          python3 hack/verify_migration_contracts.py
          python3 hack/test_migration_contracts.py
          python3 hack/verify_rust_workspace.py
          python3 hack/generate_ffi_bindings.py --check
      - name: Build, lint and native tests
        run: |
          python3 hack/run-cargo.py build --workspace
          python3 hack/run-cargo.py clippy --workspace --all-targets --all-features -- -D warnings
          python3 hack/run-cargo.py test --workspace --all-features
          python3 hack/run-cargo.py run --bin arktrace-migration-smoke
          python3 hack/test_viewer_json_roundtrip.py
          python3 hack/test_ffi_contract.py

      - name: Compile package-external async Swift SDK consumer
        env:
          ARKTRACE_RUST_SDK_CACHE_ROOT: ${{ runner.temp }}/arktrace-sdk-artifacts
          ARKTRACE_RUST_SDK_CONSUMER_CACHE_ROOT: ${{ runner.temp }}/arktrace-sdk-consumer
        run: |
          python3 hack/build_macos_rust_sdk.py --fixtures > sdk-artifact.json
          export ARKTRACE_RUST_XCFRAMEWORK="$(python3 -c 'import json; print(json.load(open("sdk-artifact.json"))["xcframework"])')"
          python3 hack/test_native_sdk_cache.py --cache-root "${{ runner.temp }}/arktrace-sdk-cache-contract" > sdk-cache-contract.json
          python3 hack/test_macos_rust_sdk.py --build-only > sdk-consumer.json
          ARKTRACE_EVENT_ORACLE_CACHE_ROOT="${{ runner.temp }}/arktrace-event-reference" python3 hack/test_macos_event_sdk.py --reference-build-only > sdk-event-reference.json
          ARKTRACE_EVENT_ORACLE_CACHE_ROOT="${{ runner.temp }}/arktrace-density-reference" python3 hack/test_macos_density_sdk.py --reference-build-only > sdk-density-reference.json
          ARKTRACE_EVENT_ORACLE_CACHE_ROOT="${{ runner.temp }}/arktrace-batch-reference" python3 hack/test_macos_batch_sdk.py --reference-build-only > sdk-batch-reference.json
          ARKTRACE_EVENT_ORACLE_CACHE_ROOT="${{ runner.temp }}/arktrace-deadline-reference" python3 hack/test_macos_deadline_sdk.py --reference-build-only > sdk-deadline-reference.json
          ARKTRACE_EVENT_ORACLE_CACHE_ROOT="${{ runner.temp }}/arktrace-repository-reference" python3 hack/test_macos_repository_sdk.py --reference-build-only > sdk-repository-reference.json
          echo 'SDK compile-only; real parser lifecycle/parity acceptance is a separate native gate.'

      - name: Upload Swift SDK compile receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-sdk-compile-receipts
          path: |
            sdk-artifact.json
            sdk-cache-contract.json
            sdk-consumer.json
            sdk-event-reference.json
            sdk-density-reference.json
            sdk-batch-reference.json
            sdk-deadline-reference.json
            sdk-repository-reference.json
            ${{ runner.temp }}/arktrace-event-reference/reference-build.log
            ${{ runner.temp }}/arktrace-density-reference/reference-build.log
            ${{ runner.temp }}/arktrace-batch-reference/reference-build.log
            ${{ runner.temp }}/arktrace-deadline-reference/reference-build.log
            ${{ runner.temp }}/arktrace-sdk-consumer/sdk-build.log
            ${{ runner.temp }}/arktrace-sdk-consumer/consumer-build.log
            ${{ runner.temp }}/arktrace-sdk-consumer/sdk-unit-tests.log
            ${{ runner.temp }}/arktrace-sdk-consumer/*.invalid.log
            ${{ runner.temp }}/arktrace-sdk-cache-contract/compiler-contract-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  rust-windows:
    name: Rust Windows native
    needs: plan
    if: needs.plan.outputs.lane_rust_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ARKTRACE_EXPECT_NATIVE_HOST: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install C# consumer SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'
      - name: Set external Cargo cache
        shell: pwsh
        run: '"ARKTRACE_CARGO_CACHE_ROOT=$env:RUNNER_TEMP/arktrace-cargo" >> $env:GITHUB_ENV'
      - name: Format, architecture, licenses and contract checks
        # Bash propagates every native command failure in these multi-command steps.
        shell: bash
        run: |
          python hack/run-cargo.py fmt --all -- --check
          python hack/verify_migration_contracts.py
          python hack/test_migration_contracts.py
          python hack/verify_rust_workspace.py
          python hack/generate_ffi_bindings.py --check
      - name: Build, lint and native tests
        shell: bash
        run: |
          python hack/run-cargo.py build --workspace
          python hack/run-cargo.py clippy --workspace --all-targets --all-features -- -D warnings
          python hack/run-cargo.py test --workspace --all-features
          python hack/run-cargo.py run --bin arktrace-migration-smoke
          python hack/test_viewer_json_roundtrip.py
          python hack/test_ffi_contract.py

      - name: Windows production acceptance guard regressions
        shell: pwsh
        run: ./hack/Test-WindowsProductionAcceptanceContract.ps1

  # The single required check for branch protection. It runs always, and it
  # fails when a planned lane failed, was cancelled, or was skipped despite
  # the plan asking for it -- so job-level skips can never drift past
  # protection.
  ci-required:
    name: CI required
    needs: [plan, swiftpm, app, contracts, rust-macos, rust-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate lane results against the plan
        run: |
          set -u
          failures=0
          check() {
            lane_name=$1
            planned=$2
            result=$3
            if [ "$planned" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::planned lane '$lane_name' finished '$result'"
                failures=$((failures + 1))
              fi
            else
              if [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
                echo "::error::unplanned lane '$lane_name' finished '$result'"
                failures=$((failures + 1))
              fi
            fi
          }
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "::error::lane planner failed"
            failures=$((failures + 1))
          fi
          check swiftpm "${{ needs.plan.outputs.lane_swiftpm }}" "${{ needs.swiftpm.result }}"
          check app "${{ needs.plan.outputs.lane_app }}" "${{ needs.app.result }}"
          check contracts "${{ needs.plan.outputs.lane_contracts }}" "${{ needs.contracts.result }}"
          check rust-macos "${{ needs.plan.outputs.lane_rust_macos }}" "${{ needs.rust-macos.result }}"
          check rust-windows "${{ needs.plan.outputs.lane_rust_windows }}" "${{ needs.rust-windows.result }}"
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
          echo 'All planned lanes succeeded.'

  # Real-parser, real-fixture medium benchmark. Nightly or manual only, never
  # a merge gate. Hosted runners start with neither the gitignored parser nor
  # the 265 MB fixture, so this lane restores exact-key caches or downloads
  # both approved inputs. Every restored or downloaded input is verified before
  # use; a missing or drifted input remains a red run, never a fake green.
  benchmark-slow:
    name: Medium benchmark (slow lane)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pin Xcode 27.0 (fail closed)
        run: |
          if [ ! -d "$PINNED_DEVELOPER_DIR" ]; then
            echo "::error::pinned toolchain $PINNED_DEVELOPER_DIR is absent on this runner"
            exit 1
          fi
          echo "DEVELOPER_DIR=$PINNED_DEVELOPER_DIR" >> "$GITHUB_ENV"

      # This cache is scoped to the complete committed provenance manifest and
      # every recipe input. It is used only by the slow lane; the fast jobs keep
      # proving their parser-absent behavior. A restored binary still has to
      # pass the manifest SHA check below before it can execute.
      - name: Restore pinned parser cache
        id: parser-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/TraceStreamer/macx/trace_streamer
          key: trace-streamer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/TraceStreamer/macx/manifest.json', 'third_party/TraceStreamer/source-lock.json', 'third_party/TraceStreamer/patches/**', 'hack/build_trace_streamer.sh', 'hack/phase3_shell_safety.sh') }}

      - name: Download a missing approved parser
        if: steps.parser-cache.outputs.cache-hit != 'true'
        run: |
          parser=third_party/TraceStreamer/macx/trace_streamer
          partial=$(mktemp "$RUNNER_TEMP/trace-streamer.XXXXXX")
          trap 'rm -f -- "$partial"' EXIT HUP INT TERM
          asset="https://github.com/ArkDeck/ArkTrace/releases/download/$TRACE_STREAMER_RELEASE_TAG/trace_streamer-macos-arm64"
          curl --proto '=https' --tlsv1.2 --location --fail --silent \
            --show-error --retry 3 --retry-all-errors \
            --output "$partial" "$asset"
          expected=$(jq -er '.binarySHA256' third_party/TraceStreamer/macx/manifest.json)
          actual=$(shasum -a 256 "$partial" | awk '{print $1}')
          [ "$actual" = "$expected" ] || {
            echo '::error::downloaded TraceStreamer asset differs from the committed manifest'
            exit 1
          }
          chmod 755 "$partial"
          mv -f "$partial" "$parser"
          trap - EXIT HUP INT TERM

      - name: Require the pinned parser (fail closed, no fake pass)
        run: |
          parser=third_party/TraceStreamer/macx/trace_streamer
          if [ ! -x "$parser" ]; then
            echo '::error::parser cache restore/download did not produce an executable pinned TraceStreamer; refusing to record a benchmark without the real parser'
            exit 1
          fi
          expected=$(jq -er '.binarySHA256' third_party/TraceStreamer/macx/manifest.json)
          actual=$(shasum -a 256 "$parser" | awk '{print $1}')
          [ "$actual" = "$expected" ] || { echo '::error::parser bytes drifted from the manifest'; exit 1; }

      - name: Save pinned parser cache
        if: steps.parser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/TraceStreamer/macx/trace_streamer
          key: ${{ steps.parser-cache.outputs.cache-primary-key }}

      # Cache only the verified fixture and its ownership marker, not the
      # temporary upstream checkout used to acquire it on a cold runner.
      - name: Restore locked medium fixture cache
        id: fixture-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/phase3-fixtures/.arktrace-phase3-fixtures-v1
            .build/phase3-fixtures/pbreader.htrace
          key: phase3-medium-fixture-${{ hashFiles('test/fixtures/phase3-performance-fixtures.json') }}

      - name: Fetch and verify locked medium fixture
        run: hack/fetch_phase3_fixtures.sh

      - name: Save locked medium fixture cache
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/phase3-fixtures/.arktrace-phase3-fixtures-v1
            .build/phase3-fixtures/pbreader.htrace
          key: ${{ steps.fixture-cache.outputs.cache-primary-key }}

      - name: Run medium benchmark
        run: hack/benchmark.sh phase4 medium

  # Scheduled runs can fail in benchmark-slow while CI required stays green,
  # because that lane is not a merge gate. This job is the alert for that
  # gap and for any other red lane on the nightly cron. It does not run on
  # pull requests.
  scheduled-failure-alert:
    name: Alert on scheduled failure
    needs: [plan, swiftpm, app, contracts, rust-macos, rust-windows, benchmark-slow, ci-required]
    if: always() && github.event_name == 'schedule' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_HEAD_SHA: ${{ github.sha }}
          ALERT_PLAN: ${{ needs.plan.result }}
          ALERT_SWIFTPM: ${{ needs.swiftpm.result }}
          ALERT_APP: ${{ needs.app.result }}
          ALERT_CONTRACTS: ${{ needs.contracts.result }}
          ALERT_RUST_MACOS: ${{ needs.rust-macos.result }}
          ALERT_RUST_WINDOWS: ${{ needs.rust-windows.result }}
          ALERT_BENCHMARK: ${{ needs.benchmark-slow.result }}
          ALERT_REQUIRED: ${{ needs.ci-required.result }}
          ALERT_LANE_SWIFTPM: ${{ needs.plan.outputs.lane_swiftpm }}
          ALERT_LANE_APP: ${{ needs.plan.outputs.lane_app }}
          ALERT_LANE_CONTRACTS: ${{ needs.plan.outputs.lane_contracts }}
          ALERT_LANE_RUST_MACOS: ${{ needs.plan.outputs.lane_rust_macos }}
          ALERT_LANE_RUST_WINDOWS: ${{ needs.plan.outputs.lane_rust_windows }}
        run: |
          set -eu
          failed=""
          add() {
            if [ -n "$failed" ]; then
              failed="$failed,$1"
            else
              failed="$1"
            fi
          }
          consider() {
            result=$1
            planned=$2
            id=$3
            if [ "$planned" != "true" ]; then
              return 0
            fi
            case "$result" in
              success) ;;
              *) add "$id" ;;
            esac
          }
          consider "$ALERT_PLAN" true plan
          consider "$ALERT_SWIFTPM" "$ALERT_LANE_SWIFTPM" swiftpm
          consider "$ALERT_APP" "$ALERT_LANE_APP" app
          consider "$ALERT_CONTRACTS" "$ALERT_LANE_CONTRACTS" contracts
          consider "$ALERT_RUST_MACOS" "$ALERT_LANE_RUST_MACOS" rust-macos
          consider "$ALERT_RUST_WINDOWS" "$ALERT_LANE_RUST_WINDOWS" rust-windows
          case "$ALERT_BENCHMARK" in
            success) ;;
            *) add benchmark-slow ;;
          esac
          case "$ALERT_REQUIRED" in
            success) ;;
            *) add ci-required ;;
          esac
          export ALERT_FAILED_JOBS="$failed"
          sh hack/scheduled_ci_alert.sh
