[package]
name = "arktrace-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
process-fixtures = []

[[bin]]
name = "arktrace-process-fixture"
path = "tests/support/process_fixture.rs"
required-features = ["process-fixtures"]

[[test]]
name = "macos_process"
required-features = ["process-fixtures"]

[[test]]
name = "macos_owners"
required-features = ["process-fixtures"]

[[bin]]
name = "arktrace-windows-process-child"
path = "tests/support/windows_process_child.rs"
required-features = ["process-fixtures"]

[[test]]
name = "windows_process"
required-features = ["process-fixtures"]

[dependencies]
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Storage_FileSystem",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json.workspace = true

# Syscalls are confined to the macOS and Windows modules. All other platform
# code denies unsafe; every non-platform first-party crate keeps workspace forbid.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
