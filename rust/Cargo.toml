[workspace]
members = ["crates/arktrace-contract", "crates/arktrace-platform", "crates/arktrace-store", "crates/arktrace-analysis"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
unicode-normalization = "=0.1.25"
arktrace-contract = { path = "crates/arktrace-contract" }
arktrace-platform = { path = "crates/arktrace-platform" }
arktrace-engine = { path = "crates/arktrace-engine" }
arktrace-store = { path = "crates/arktrace-store" }
arktrace-analysis = { path = "crates/arktrace-analysis" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
panic = "unwind"
