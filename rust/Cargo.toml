[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
unicode-normalization = "=0.1.25"
arktrace-contract = { path = "crates/arktrace-contract" }
arktrace-platform = { path = "crates/arktrace-platform" }
arktrace-engine = { path = "crates/arktrace-engine" }
arktrace-store = { path = "crates/arktrace-store" }
arktrace-analysis = { path = "crates/arktrace-analysis" }
arktrace-viewer = { path = "crates/arktrace-viewer" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

# Each agent task owns a Cargo target; incremental caches and full debuginfo
# made those targets fill the host disk. Line tables keep file:line in panics.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "unwind"
